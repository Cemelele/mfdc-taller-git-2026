spring.application.name=mfdc-taller-git-2026

# H2 en archivo: los datos sobreviven al reinicio de la aplicacion.
spring.datasource.url=jdbc:h2:file:./data/entidades-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema al arrancar y no borra filas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para ver las tablas en desarrollo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API REST externa consumida con WebClient.
api.externa.base-url=https://api.restful-api.dev

# Companeros del taller: simulaciones de explosion.
companeros.a2.base-url=${A2_BASE_URL:http://localhost:8081}
companeros.a2.explosion-path=/api/minecraft/simulaciones/explosion
companeros.a3.base-url=${A3_BASE_URL:http://localhost:8082}
companeros.a3.explosion-path=/minecraft/sgomezdelafuente/simulaciones/explosion

# OpenAPI 3 y Swagger UI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

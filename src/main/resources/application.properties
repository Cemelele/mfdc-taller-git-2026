spring.application.name=mfdc-taller-git-2026

# H2 en archivo: los datos sobreviven al reinicio de la aplicacion.
spring.datasource.url=jdbc:h2:file:./data/entidades-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza el esquema al arrancar y no borra filas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 para ver las tablas en desarrollo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
